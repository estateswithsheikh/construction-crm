<title>Construction Operations CRM</title>
<meta name="description" content="Leads, quotes, invoices, projects, crew payroll and job costing for a construction company.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed 256px workspace sidebar + scrolling console; bottom tab bar under 900px. Square corners, uppercase eyebrows, one orange accent. */
:root{
  --bg:#FCFAF8; --fg:#13171F; --card:#FFFFFF; --muted:#EDEEF2; --muted-fg:#585E6A;
  --border:#D7DAE0; --input:#FFFFFF; --grid:#E6E8EC;
  --primary:#F47C1A; --primary-fg:#0A0A0A;
  --danger:#DB2424; --ok:#15803D; --warn:#B45309; --info:#1D4ED8; --violet:#6D28D9;
  --today:#0A5FDB; --today-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(16,20,28,.06), 0 8px 24px rgba(16,20,28,.06);
  --font-display:'Archivo','Arial Black',system-ui,sans-serif;
  --font-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F11; --fg:#F1F4F7; --card:#14161A; --muted:#1E2024; --muted-fg:#8F99A8;
  --border:#2B2F36; --input:#0D0F11; --grid:rgba(255,255,255,.04);
  --danger:#F05252; --ok:#4ADE80; --warn:#FBBF24; --info:#60A5FA; --violet:#A78BFA;
  --today:#5AA2F6; --today-fg:#13171F; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F11; --fg:#F1F4F7; --card:#14161A; --muted:#1E2024; --muted-fg:#8F99A8;
  --border:#2B2F36; --input:#0D0F11; --grid:rgba(255,255,255,.04);
  --danger:#F05252; --ok:#4ADE80; --warn:#FBBF24; --info:#60A5FA; --violet:#A78BFA;
  --today:#5AA2F6; --today-fg:#13171F; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* Shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 20px 20px;border-bottom:1px solid var(--border)}
.logo{width:48px;height:44px;display:grid;place-items:center;border:1px solid var(--border);background:var(--card);overflow:hidden;flex:none}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.logo .mark{font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:-.02em;color:var(--primary)}
.brand .crm{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;flex:1;min-width:0}
.brand .crm small{display:block;font-size:10px;letter-spacing:.06em;color:var(--muted-fg);text-transform:none;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border);background:var(--card);cursor:pointer;border-radius:var(--r)}
.iconbtn:hover{background:var(--muted)}
.nav{padding:20px 12px 24px;display:flex;flex-direction:column;gap:2px}
.nav .eyebrow{padding:8px 12px 10px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;text-decoration:none;font-size:14.5px;font-weight:500;border-left:2px solid transparent;border-radius:0 var(--r) var(--r) 0}
.nav a:hover{background:var(--muted)}
.nav a.on{background:color-mix(in srgb,var(--primary) 11%,transparent);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.nav a.indent{padding-left:28px;font-size:12.5px}
.nav .sep{height:1px;background:var(--border);margin:14px 12px}
.side-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-fg)}
.main{min-width:0;position:relative}
.page{padding-block:44px 96px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px));max-width:1280px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 48px;border-bottom:1px solid var(--border);font-size:13px;background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.banner.info{background:color-mix(in srgb,var(--info) 8%,var(--card))}

/* Type */
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-fg)}
.eyebrow.accent{color:var(--primary)}
h1.title{font-family:var(--font-display);font-weight:900;font-size:40px;line-height:1.05;letter-spacing:-.025em;margin:8px 0 10px;text-wrap:balance}
h2.h2{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:0}
h3.h3{font-size:15px;font-weight:800;margin:0}
.lede{color:var(--muted-fg);font-size:15px;margin:0;max-width:68ch}
.muted{color:var(--muted-fg)}
.small{font-size:12.5px}
.xs{font-size:11.5px}
.strong{font-weight:700}

/* Page header */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.phead .acts{display:flex;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-fg);background:none;border:0;cursor:pointer;padding:0;margin-bottom:18px}
.back:hover{color:var(--fg)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border:1px solid var(--border);background:var(--card);border-radius:var(--r);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--muted)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 10%,var(--card))}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{height:32px;padding:0 12px;font-size:11px}
.btn-xs{height:26px;padding:0 9px;font-size:10.5px;letter-spacing:.07em}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:700;cursor:pointer;font-size:inherit}
.linkbtn:hover{text-decoration:underline}

/* Panels */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.pad{padding:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-h > div:first-child{min-width:0;flex:1 1 220px}
.nw{white-space:nowrap}
.panel-h .sub{font-size:12.5px;color:var(--muted-fg);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.sticky{position:sticky;top:20px}

/* Filters */
.filters{display:flex;flex-direction:column;gap:18px;padding:20px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow > .grow{flex:1 1 280px;min-width:0}
.fcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{height:26px;padding:0 10px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--border);background:var(--muted);color:color-mix(in srgb,var(--fg) 70%,var(--muted-fg));cursor:pointer;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:color-mix(in srgb,var(--fg) 30%,var(--border))}
.chip.on{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--card))}
.chip .ct{font-family:var(--font-mono);font-size:10px;padding:0 5px;background:var(--card);border:1px solid var(--border)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.seg button{height:30px;padding:0 12px;border:0;background:var(--card);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button + button{border-left:1px solid var(--border)}
.seg button.on{background:var(--primary);color:var(--primary-fg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lbl{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--fg) 75%,var(--muted-fg))}
.hint{font-size:11.5px;color:var(--muted-fg)}
.inp,select.inp,textarea.inp{width:100%;height:42px;padding:0 12px;border:1px solid var(--border);background:var(--input);border-radius:var(--r);font-size:14px;min-width:0}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
textarea.mono{font-size:12.5px}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.inp-sm{height:34px;font-size:13px;padding:0 10px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-fg)}
.search .inp{padding-left:40px}
.check{display:inline-flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{accent-color:var(--primary);width:16px;height:16px}

/* Tables */
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);background:var(--muted);padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--border)}
.t td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:color-mix(in srgb,var(--primary) 4%,var(--card))}
.t td.r,.t th.r{text-align:right}
.t tfoot td{font-weight:800;background:var(--muted);border-top:1px solid var(--border)}
.cell-main{font-weight:700}
.cell-sub{font-size:12px;color:var(--muted-fg)}
.count{font-size:13px;color:var(--muted-fg);margin:20px 0 10px}
.count b{color:var(--fg)}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:var(--r);white-space:nowrap;border:1px solid transparent;--c:var(--muted-fg);color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border-color:color-mix(in srgb,var(--c) 28%,transparent)}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.c-grey{--c:var(--muted-fg)} .c-ok{--c:var(--ok)} .c-warn{--c:var(--warn)} .c-bad{--c:var(--danger)} .c-info{--c:var(--info)} .c-violet{--c:var(--violet)} .c-pri{--c:var(--primary)}
.ex{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--violet);border:1px dashed color-mix(in srgb,var(--violet) 50%,transparent);padding:1px 5px;margin-left:6px;vertical-align:middle}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--border);padding:16px 16px 14px;border-radius:var(--r);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--primary))}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:27px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-size:12px;color:var(--muted-fg)}

/* Empty state */
.empty{padding:56px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{width:44px;height:44px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);margin-bottom:6px}
.empty h3{font-size:19px;font-weight:800;margin:0}
.empty p{margin:0 0 10px;color:var(--muted-fg);max-width:46ch}
.mini-empty{padding:22px;text-align:center;color:var(--muted-fg);font-size:13px}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li.click{cursor:pointer}
.li.click:hover{background:color-mix(in srgb,var(--primary) 4%,var(--card))}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Bars */
.bars{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--muted);position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--primary)}
.bar .fill.alt{background:color-mix(in srgb,var(--fg) 55%,var(--card))}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--muted);border:1px solid var(--border);min-height:200px;display:flex;flex-direction:column}
.kcol h4{margin:0;padding:10px 12px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}
.kcards{padding:8px;display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--card);border:1px solid var(--border);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kcard:hover{border-color:var(--primary)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--border);border-top:1px solid var(--border)}
.cal .dow{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);padding:8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--muted)}
.cal .day{min-height:112px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--card)}
.cal .day.out{background:var(--bg);color:var(--muted-fg)}
.cal .dn{font-size:12px;font-weight:700;width:24px;height:24px;display:grid;place-items:center}
.cal .day.today .dn{background:var(--today);color:var(--today-fg);border-radius:50%}
.ev{font-size:11.5px;font-weight:700;padding:2px 6px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.legend{display:flex;gap:6px;flex-wrap:wrap}

/* Quote builder */
.opt-tabs{display:flex;gap:6px;flex-wrap:wrap}
.opt-tabs button{height:34px;min-width:44px;padding:0 12px;border:1px solid var(--border);background:var(--card);font-weight:800;font-size:12px;letter-spacing:.06em;cursor:pointer}
.opt-tabs button.on{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--card))}
.lines{width:100%;border-collapse:collapse}
.lines th{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);text-align:left;padding:6px 6px;border-bottom:1px solid var(--border)}
.lines td{padding:6px;vertical-align:top;border-bottom:1px solid var(--border)}
.lines .inp{height:36px;font-size:13px}
.lines .amt{font-family:var(--font-mono);text-align:right;padding-top:14px;white-space:nowrap}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 24px;font-size:13.5px;justify-items:end;margin-left:auto;max-width:340px}
.totals .t-l{justify-self:start;color:var(--muted-fg)}
.totals .grand{font-family:var(--font-display);font-weight:900;font-size:20px;color:var(--fg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--muted-fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .kv dd{margin:0;text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere} .kv dd.num{white-space:nowrap}
.kv{grid-template-columns:minmax(0,1fr) auto}
.ai-box{border:1px solid color-mix(in srgb,var(--primary) 35%,var(--border))}
.ai-ic{width:30px;height:30px;display:grid;place-items:center;background:var(--primary);color:var(--primary-fg)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:8px 0;font-size:13px}
.tl::before{content:"";width:8px;height:8px;background:var(--primary);margin-top:6px}

/* Document preview */
.doc{background:#fff;color:#16181d;border:1px solid var(--border);padding:40px;font-size:13px;box-shadow:var(--shadow)}
.doc h1{font-family:var(--font-display);font-weight:900;font-size:26px;margin:0;letter-spacing:-.02em;color:#16181d}
.doc .dh{display:flex;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:3px solid var(--primary);margin-bottom:18px;flex-wrap:wrap}
.doc table{width:100%;border-collapse:collapse;margin:8px 0 14px}
.doc th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:left;border-bottom:1px solid #ccd;padding:6px 4px;color:#555}
.doc td{padding:7px 4px;border-bottom:1px solid #eef}
.doc .r{text-align:right}
.doc .muted{color:#666}
.doc .opt{margin-top:18px}
.doc .opt h3{font-size:14px;margin:0 0 2px}
.doc img.dlogo{max-height:64px;max-width:200px}

/* Modal, drawer, toast */
.overlay{position:fixed;inset:0;background:rgba(9,11,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--border);width:min(620px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);border-radius:var(--r)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h2{font-family:var(--font-display);font-weight:800;font-size:19px;margin:0}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.toasts{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);padding:12px 16px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;max-width:360px}
.toast.bad{border-left:3px solid var(--danger)} .toast.ok{border-left:3px solid var(--ok)}
