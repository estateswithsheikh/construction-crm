<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23F47C1A%27/%3E%3Cpath d=%27M6 22h20v3H6zM9 21a7 7 0 0 1 14 0z%27 fill=%27%230A0A0A%27/%3E%3C/svg%3E">
<title>Construction Operations CRM</title>
<meta name="description" content="Leads, quotes, invoices, projects, crew payroll and job costing for a construction company.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed 256px workspace sidebar + scrolling console; bottom tab bar under 900px. Square corners, uppercase eyebrows, one orange accent. */
:root{
  --bg:#FCFAF8; --fg:#13171F; --card:#FFFFFF; --muted:#EDEEF2; --muted-fg:#585E6A;
  --border:#D7DAE0; --input:#FFFFFF; --grid:#E6E8EC;
  --primary:#F47C1A; --primary-fg:#0A0A0A;
  --danger:#DB2424; --ok:#15803D; --warn:#B45309; --info:#1D4ED8; --violet:#6D28D9;
  --today:#0A5FDB; --today-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(16,20,28,.06), 0 8px 24px rgba(16,20,28,.06);
  --font-display:'Archivo','Arial Black',system-ui,sans-serif;
  --font-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F11; --fg:#F1F4F7; --card:#14161A; --muted:#1E2024; --muted-fg:#8F99A8;
  --border:#2B2F36; --input:#0D0F11; --grid:rgba(255,255,255,.04);
  --danger:#F05252; --ok:#4ADE80; --warn:#FBBF24; --info:#60A5FA; --violet:#A78BFA;
  --today:#5AA2F6; --today-fg:#13171F; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F11; --fg:#F1F4F7; --card:#14161A; --muted:#1E2024; --muted-fg:#8F99A8;
  --border:#2B2F36; --input:#0D0F11; --grid:rgba(255,255,255,.04);
  --danger:#F05252; --ok:#4ADE80; --warn:#FBBF24; --info:#60A5FA; --violet:#A78BFA;
  --today:#5AA2F6; --today-fg:#13171F; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* Shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 20px 20px;border-bottom:1px solid var(--border)}
.logo{width:48px;height:44px;display:grid;place-items:center;border:1px solid var(--border);background:var(--card);overflow:hidden;flex:none}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.logo .mark{font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:-.02em;color:var(--primary)}
.brand .crm{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;flex:1;min-width:0}
.brand .crm small{display:block;font-size:10px;letter-spacing:.06em;color:var(--muted-fg);text-transform:none;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border);background:var(--card);cursor:pointer;border-radius:var(--r)}
.iconbtn:hover{background:var(--muted)}
.nav{padding:20px 12px 24px;display:flex;flex-direction:column;gap:2px}
.nav .eyebrow{padding:8px 12px 10px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;text-decoration:none;font-size:14.5px;font-weight:500;border-left:2px solid transparent;border-radius:0 var(--r) var(--r) 0}
.nav a:hover{background:var(--muted)}
.nav a.on{background:color-mix(in srgb,var(--primary) 11%,transparent);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.nav a.indent{padding-left:28px;font-size:12.5px}
.nav .sep{height:1px;background:var(--border);margin:14px 12px}
.side-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-fg)}
.main{min-width:0;position:relative}
.page{padding-block:44px 96px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px));max-width:1280px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 48px;border-bottom:1px solid var(--border);font-size:13px;background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.banner.info{background:color-mix(in srgb,var(--info) 8%,var(--card))}

/* Type */
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-fg)}
.eyebrow.accent{color:var(--primary)}
h1.title{font-family:var(--font-display);font-weight:900;font-size:40px;line-height:1.05;letter-spacing:-.025em;margin:8px 0 10px;text-wrap:balance}
h2.h2{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:0}
h3.h3{font-size:15px;font-weight:800;margin:0}
.lede{color:var(--muted-fg);font-size:15px;margin:0;max-width:68ch}
.muted{color:var(--muted-fg)}
.small{font-size:12.5px}
.xs{font-size:11.5px}
.strong{font-weight:700}

/* Page header */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.phead .acts{display:flex;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-fg);background:none;border:0;cursor:pointer;padding:0;margin-bottom:18px}
.back:hover{color:var(--fg)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border:1px solid var(--border);background:var(--card);border-radius:var(--r);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--muted)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 10%,var(--card))}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{height:32px;padding:0 12px;font-size:11px}
.btn-xs{height:26px;padding:0 9px;font-size:10.5px;letter-spacing:.07em}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:700;cursor:pointer;font-size:inherit}
.linkbtn:hover{text-decoration:underline}

/* Panels */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.pad{padding:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-h > div:first-child{min-width:0;flex:1 1 220px}
.nw{white-space:nowrap}
.panel-h .sub{font-size:12.5px;color:var(--muted-fg);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.sticky{position:sticky;top:20px}

/* Filters */
.filters{display:flex;flex-direction:column;gap:18px;padding:20px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow > .grow{flex:1 1 280px;min-width:0}
.fcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{height:26px;padding:0 10px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--border);background:var(--muted);color:color-mix(in srgb,var(--fg) 70%,var(--muted-fg));cursor:pointer;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:color-mix(in srgb,var(--fg) 30%,var(--border))}
.chip.on{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--card))}
.chip .ct{font-family:var(--font-mono);font-size:10px;padding:0 5px;background:var(--card);border:1px solid var(--border)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.seg button{height:30px;padding:0 12px;border:0;background:var(--card);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button + button{border-left:1px solid var(--border)}
.seg button.on{background:var(--primary);color:var(--primary-fg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lbl{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--fg) 75%,var(--muted-fg))}
.hint{font-size:11.5px;color:var(--muted-fg)}
.inp,select.inp,textarea.inp{width:100%;height:42px;padding:0 12px;border:1px solid var(--border);background:var(--input);border-radius:var(--r);font-size:14px;min-width:0}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
textarea.mono{font-size:12.5px}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.inp-sm{height:34px;font-size:13px;padding:0 10px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-fg)}
.search .inp{padding-left:40px}
.check{display:inline-flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{accent-color:var(--primary);width:16px;height:16px}

/* Tables */
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);background:var(--muted);padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--border)}
.t td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:color-mix(in srgb,var(--primary) 4%,var(--card))}
.t td.r,.t th.r{text-align:right}
.t tfoot td{font-weight:800;background:var(--muted);border-top:1px solid var(--border)}
.cell-main{font-weight:700}
.cell-sub{font-size:12px;color:var(--muted-fg)}
.count{font-size:13px;color:var(--muted-fg);margin:20px 0 10px}
.count b{color:var(--fg)}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:var(--r);white-space:nowrap;border:1px solid transparent;--c:var(--muted-fg);color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border-color:color-mix(in srgb,var(--c) 28%,transparent)}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.c-grey{--c:var(--muted-fg)} .c-ok{--c:var(--ok)} .c-warn{--c:var(--warn)} .c-bad{--c:var(--danger)} .c-info{--c:var(--info)} .c-violet{--c:var(--violet)} .c-pri{--c:var(--primary)}
.ex{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--violet);border:1px dashed color-mix(in srgb,var(--violet) 50%,transparent);padding:1px 5px;margin-left:6px;vertical-align:middle}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--border);padding:16px 16px 14px;border-radius:var(--r);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--primary))}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:27px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-size:12px;color:var(--muted-fg)}

/* Empty state */
.empty{padding:56px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{width:44px;height:44px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);margin-bottom:6px}
.empty h3{font-size:19px;font-weight:800;margin:0}
.empty p{margin:0 0 10px;color:var(--muted-fg);max-width:46ch}
.mini-empty{padding:22px;text-align:center;color:var(--muted-fg);font-size:13px}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li.click{cursor:pointer}
.li.click:hover{background:color-mix(in srgb,var(--primary) 4%,var(--card))}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Bars */
.bars{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--muted);position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--primary)}
.bar .fill.alt{background:color-mix(in srgb,var(--fg) 55%,var(--card))}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--muted);border:1px solid var(--border);min-height:200px;display:flex;flex-direction:column}
.kcol h4{margin:0;padding:10px 12px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}
.kcards{padding:8px;display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--card);border:1px solid var(--border);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kcard:hover{border-color:var(--primary)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--border);border-top:1px solid var(--border)}
.cal .dow{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);padding:8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--muted)}
.cal .day{min-height:112px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--card)}
.cal .day.out{background:var(--bg);color:var(--muted-fg)}
.cal .dn{font-size:12px;font-weight:700;width:24px;height:24px;display:grid;place-items:center}
.cal .day.today .dn{background:var(--today);color:var(--today-fg);border-radius:50%}
.ev{font-size:11.5px;font-weight:700;padding:2px 6px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.legend{display:flex;gap:6px;flex-wrap:wrap}

/* Quote builder */
.opt-tabs{display:flex;gap:6px;flex-wrap:wrap}
.opt-tabs button{height:34px;min-width:44px;padding:0 12px;border:1px solid var(--border);background:var(--card);font-weight:800;font-size:12px;letter-spacing:.06em;cursor:pointer}
.opt-tabs button.on{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--card))}
.lines{width:100%;border-collapse:collapse}
.lines th{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg);text-align:left;padding:6px 6px;border-bottom:1px solid var(--border)}
.lines td{padding:6px;vertical-align:top;border-bottom:1px solid var(--border)}
.lines .inp{height:36px;font-size:13px}
.lines .amt{font-family:var(--font-mono);text-align:right;padding-top:14px;white-space:nowrap}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 24px;font-size:13.5px;justify-items:end;margin-left:auto;max-width:340px}
.totals .t-l{justify-self:start;color:var(--muted-fg)}
.totals .grand{font-family:var(--font-display);font-weight:900;font-size:20px;color:var(--fg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--muted-fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .kv dd{margin:0;text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere} .kv dd.num{white-space:nowrap}
.kv{grid-template-columns:minmax(0,1fr) auto}
.ai-box{border:1px solid color-mix(in srgb,var(--primary) 35%,var(--border))}
.ai-ic{width:30px;height:30px;display:grid;place-items:center;background:var(--primary);color:var(--primary-fg)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:8px 0;font-size:13px}
.tl::before{content:"";width:8px;height:8px;background:var(--primary);margin-top:6px}

/* Document preview */
.doc{background:#fff;color:#16181d;border:1px solid var(--border);padding:40px;font-size:13px;box-shadow:var(--shadow)}
.doc h1{font-family:var(--font-display);font-weight:900;font-size:26px;margin:0;letter-spacing:-.02em;color:#16181d}
.doc .dh{display:flex;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:3px solid var(--primary);margin-bottom:18px;flex-wrap:wrap}
.doc table{width:100%;border-collapse:collapse;margin:8px 0 14px}
.doc th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:left;border-bottom:1px solid #ccd;padding:6px 4px;color:#555}
.doc td{padding:7px 4px;border-bottom:1px solid #eef}
.doc .r{text-align:right}
.doc .muted{color:#666}
.doc .opt{margin-top:18px}
.doc .opt h3{font-size:14px;margin:0 0 2px}
.doc img.dlogo{max-height:64px;max-width:200px}

/* Modal, drawer, toast */
.overlay{position:fixed;inset:0;background:rgba(9,11,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--border);width:min(620px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);border-radius:var(--r)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h2{font-family:var(--font-display);font-weight:800;font-size:19px;margin:0}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}

  strip(o) { const c = { ...o }; delete c.id; return JSON.parse(JSON.stringify(c)); },
  async add(col, data, id) {

function fail(e) {

  else if (code === 'quota_exceeded') toast('The database is full. Delete old records (or example data) to add more.', 'bad');
  else if (code === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.', 'bad');

  const err = new Error('save failed'); err.shown = true; err.cause = e; throw err;
}

/* ============ Calculations ============ */
const taxRate = (opt) => (opt && opt.taxType === 'none' ? 0 : num(S.cfg.taxRate) / 100);
function optCalc(opt, q) {
  const items = (opt && opt.items) || [];
  const sub = sum(items, (it) => (it.included ? 0 : num(it.qty) * num(it.rate)));
  const d = (q && q.discount) || {};
  const dv = num(d.value);
  const has = d.type && d.type !== 'none' && dv > 0;
  let pre = 0, post = 0;
  if (has && d.applies !== 'post') pre = Math.min(sub, d.type === 'percent' ? (sub * dv) / 100 : dv);
  const taxable = Math.max(0, sub - pre);
  const tax = taxable * taxRate(opt);
  let total = taxable + tax;
  if (has && d.applies === 'post') { post = Math.min(total, d.type === 'percent' ? (total * dv) / 100 : dv); total -= post; }
  return { sub: round2(sub), discount: round2(pre + post), taxable: round2(taxable), tax: round2(tax), total: round2(total), net: round2(taxable - post) };
}
const quoteCalcs = (q) => (q.options || []).map((o) => optCalc(o, q));
function quoteValue(q) {
  const c = quoteCalcs(q); const o = q.options || [];
  const acc = o.map((x, i) => (x.accepted ? i : -1)).filter((i) => i >= 0);
  return acc.length ? sum(acc, (i) => c[i].total) : (c[0] ? c[0].total : 0);
}
function quoteStatus(q) {
  const st = q.status || 'new';
  if ((st === 'pending' || st === 'follow_up') && q.expiresAt && q.expiresAt < todayKey()) return 'expired';
  return st;
}
const quoteTitle = (q) => q.title || (q.client && q.client.name ? q.client.name : 'Untitled quote');
const invPaid = (inv) => sum(inv.payments || [], (p) => p.amount);
function invStatus(inv) {
  if (inv.void) return 'void';
  const paid = invPaid(inv);
  if (num(inv.total) > 0 && paid >= num(inv.total) - 0.005) return 'paid';
  return paid > 0 ? 'partial' : 'pending';
}
const invDue = (inv) => (inv.void ? 0 : Math.max(0, round2(num(inv.total) - invPaid(inv))));
const invOpen = (inv) => ['pending', 'partial'].includes(invStatus(inv));
const invOverdueDays = (inv) => (invOpen(inv) && inv.dueDate && inv.dueDate < todayKey() ? daysBetween(inv.dueDate, todayKey()) : 0);
const invNet = (inv) => (inv.void ? 0 : num(inv.total) - num(inv.tax));
const expNet = (e) => num(e.amount) - num(e.hst);

function invCommission(inv) {
  const rep = byId('team', inv.repId);
  if (!rep || inv.void) return { rep: null, amount: 0 };
  return { rep, amount: round2((invNet(inv) * num(rep.commissionPct)) / 100) };
}
function projectFin(p) {
  const inv = byId('invoices', p.invoiceId);
  const revenue = inv ? invNet(inv) : num(p.revenue);
  const labor = p.labor || [];
  const hours = sum(labor, (l) => l.hours);
  const crewCost = sum(labor, (l) => num(l.hours) * num(l.rate));
  const ex = D('expenses').filter((e) => e.projectId === p.id);
  const subs = sum(ex.filter((e) => e.category === 'Subcontractor'), expNet);
  const laborExp = sum(ex.filter((e) => e.category === 'Labor'), expNet);
  const materials = sum(ex.filter((e) => e.category !== 'Subcontractor' && e.category !== 'Labor'), expNet);
  const commission = inv ? invCommission(inv).amount : 0;
  const cost = crewCost + laborExp + subs + materials + commission;
  const profit = revenue - cost;
  return { revenue, hours, labor: crewCost + laborExp, subs, materials, commission, cost, profit, margin: revenue > 0 ? profit / revenue : null, inv };
}

const RANGES = [['7d', 'Last 7D'], ['30d', 'Last 30D'], ['90d', 'Last 90D'], ['mtd', 'MTD'], ['ytd', 'YTD'], ['all', 'All time']];
function rangeOf(k) {
  const t = new Date(); const to = dkey(t);
  if (k === '7d') return { from: keyPlus(-6), to };
  if (k === '30d') return { from: keyPlus(-29), to };
  if (k === '90d') return { from: keyPlus(-89), to };
  if (k === '60d') return { from: keyPlus(-59), to };
  if (k === 'week') { const d = new Date(t); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return { from: dkey(d), to }; }
  if (k === 'mtd') return { from: `${t.getFullYear()}-${pad(t.getMonth() + 1)}-01`, to };
  if (k === 'ytd') return { from: `${t.getFullYear()}-01-01`, to };
  return { from: '2000-01-01', to: '2999-12-31' };
}

  D('quotes').forEach((q) => { const st = quoteStatus(q); if (['pending', 'follow_up', 'expired'].includes(st) && q.followUpAt) items.push({ kind: 'quotes', id: q.id, name: (q.client && q.client.name) || quoteTitle(q), phone: q.client && q.client.phone, email: q.client && q.client.email, due: q.followUpAt, repId: q.repId, snoozed: q.snoozed, rec: q, sub: `${q.ref || ''} · ${money0(quoteValue(q))} · ${statusMeta(QUOTE_STATUS, st)[1]}` }); });
  D('invoices').forEach((i) => { if (invOpen(i)) { const due = i.followUpAt || i.dueDate; if (due) items.push({ kind: 'invoices', id: i.id, name: (i.client && i.client.name) || i.number, phone: i.client && i.client.phone, email: i.client && i.client.email, due, repId: i.repId, snoozed: i.snoozed, rec: i, sub: `${i.number} · ${money(invDue(i))} due` }); } });

/* ============ Follow-ups ============ */
const OUTCOME = { answered: 'Answered', no_answer: 'No answer', voicemail: 'Voicemail', snooze: 'Snoozed', note: 'Note' };
async function logOutcome(kind, id, outcome, patch = {}, note = '') {
  const rec = byId(kind, id); if (!rec) return;
  const history = [...(rec.history || []), { at: nowISO(), outcome, note, by: S.me.id }];
  await Store.update(kind, id, { history, ...patch });
}
ACT['fu-no'] = async (el) => { const { kind, id } = el.dataset; const rec = byId(kind, id); const patch = { followUpAt: localDT(addDays(new Date(), 1)), snoozed: false }; if (kind === 'leads' && (rec.status || 'new') === 'new') patch.status = 'contacted'; if (kind === 'quotes' && quoteStatus(rec) === 'pending') patch.status = 'follow_up'; await logOutcome(kind, id, 'no_answer', patch); toast('Logged: no answer. Back in the queue tomorrow.'); };
ACT['fu-vm'] = async (el) => { const { kind, id } = el.dataset; const rec = byId(kind, id); const patch = { followUpAt: localDT(addDays(new Date(), 2)), snoozed: false }; if (kind === 'leads' && (rec.status || 'new') === 'new') patch.status = 'contacted'; if (kind === 'quotes' && quoteStatus(rec) === 'pending') patch.status = 'follow_up'; await logOutcome(kind, id, 'voicemail', patch); toast('Logged: voicemail. Follow up again in 2 days.'); };
ACT['fu-snooze'] = async (el) => { const { kind, id, days } = el.dataset; const d = addDays(new Date(), num(days)); d.setHours(9, 0, 0, 0); await logOutcome(kind, id, 'snooze', { followUpAt: localDT(d), snoozed: true }, `until ${fmtDate(dkey(d))}`); toast(`Snoozed until ${fmtDate(dkey(d))}`); };
ACT['fu-answer'] = (el) => {
  const { kind, id } = el.dataset; const rec = byId(kind, id);
  const next = localDT((() => { const d = addDays(new Date(), num(S.cfg.followUpDays) || 3); d.setHours(10, 0, 0, 0); return d; })());
  const statusSel = kind === 'quotes' ? F.select('status', 'Quote status', [['', 'No change'], ['follow_up', 'Still deciding (follow-up)'], ['lost', 'Lost']], '') : kind === 'leads' ? F.select('status', 'Lead status', [['', 'No change'], ...LEAD_STATUS.map((s) => [s[0], s[1]])], '') : '';
  openModal({
    title: 'Log a conversation', body: `<p class="small muted" style="margin:0">${esc(rec.name || (rec.client && rec.client.name) || rec.number || '')}</p><div class="grid2">${F.area('note', 'What was said', '', { rows: 3, ph: 'They want to compare two options, will decide after Friday…' })}${statusSel}${F.text('next', 'Next follow-up', next, { type: 'datetime-local', hint: 'Clear it to take them out of the queue.' })}</div>`,
    foot: `<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="fu-save">Save</button>`,
    onMount: (m) => { $('#fu-save', m).onclick = async () => { const f = formData(m); const patch = { followUpAt: f.next || null, snoozed: false }; if (f.status) patch.status = f.status; if (kind === 'leads' && !f.status && (rec.status || 'new') === 'new') patch.status = 'contacted'; await logOutcome(kind, id, 'answered', patch, f.note); closeModal(); toast('Conversation logged'); }; }
  });
};

    if (!ready('quotes')) return `<div class="panel" style="margin-top:20px">${loadingRows()}</div>`;
    const st = UI('quotes.status', 'all'), rep = UI('quotes.rep', 'all'), q = S.ui['quotes.q'];
    const rows = D('quotes').filter((x) => (st === 'all' || quoteStatus(x) === st) && (rep === 'all' || x.repId === rep) && match(q, x.ref, x.client && x.client.name, x.title, x.siteAddress)).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    const pg = pager('quotes', rows.length);
    if (!rows.length) return `<div class="count"><b>0</b> of <b>${D('quotes').length}</b> quotes</div><div class="panel">${emptyBox('briefcase', D('quotes').length ? 'No quotes match your filters' : 'No quotes yet', 'Adjust the filters or draft a new quote to get rolling.', btn('New quote', null, { go: 'quote', param: 'new', cls: 'btn-primary', icon: 'plus' }))}</div>`;
    return `<div class="count"><b>${rows.length}</b> of <b>${D('quotes').length}</b> quotes · <b>${money0(sum(rows, quoteValue))}</b> total value</div><div class="panel tablewrap"><table class="t"><thead><tr><th>Ref</th><th>Client / title</th><th>Rep</th><th>Status</th><th>Options</th><th class="r">Value</th><th>Follow-up</th><th>Created</th></tr></thead><tbody>
      ${pg.slice(rows).map((x) => `<tr class="click" data-go="quote" data-param="${x.id}" tabindex="0"><td class="mono small">${esc(x.ref)}</td><td><div class="cell-main">${esc((x.client && x.client.name) || '—')}${exTag(x)}</div><div class="cell-sub trunc" style="max-width:340px">${esc(x.title || '')}</div></td><td>${esc(pname(x.repId) || '—')}</td><td>${badge(QUOTE_STATUS, quoteStatus(x))}</td><td class="small muted">${(x.options || []).length}${(x.options || []).some((o) => o.accepted) ? ' · accepted ' + (x.options || []).map((o, i) => (o.accepted ? 'ABCDE'[i] : '')).join('') : ''}</td><td class="r num strong">${money0(quoteValue(x))}</td><td class="small">${['pending', 'follow_up', 'expired'].includes(quoteStatus(x)) ? fuCell(x.followUpAt) : '<span class="muted">—</span>'}</td><td class="small muted">${fmtDate(x.createdAt)}</td></tr>`).join('')}</tbody></table></div>${pg.html}`;
  }
};

/* ============ Quote editor ============ */

function blankQuote(lead) {

V.quote = {

          <div class="field"><label for="b-rep">Source rep</label><select class="inp" id="b-rep" data-bind="repId"><option value="">— Unattributed —</option>${repList().map((r) => `<option value="${r.id}" ${q.repId === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></div>

        </div></div>
        <div class="panel"><div class="panel-h"><div><h2 class="h2">Project header</h2><div class="sub">These show on the PDF above the options.</div></div></div><div class="pad grid2">
          ${this.inp('title', 'Custom title', q.title, 'text', "e.g. 6'H Privacy Fence — 80ft (3 sides) + 2 gates", true)}

        </div></div>
        <div class="panel"><div class="panel-h"><div><h2 class="h2">Options</h2><div class="sub">Up to 5 options, auto-labelled A–E. The client picks one (or several).</div></div><div class="opt-tabs">${q.options.map((x, i) => `<button class="${i === oi ? 'on' : ''}" data-act="ui" data-k="q.opt" data-v="${i}">${'ABCDE'[i]}${x.accepted ? ' ✓' : ''}</button>`).join('')}${q.options.length < 5 ? `<button data-act="q-addopt" title="Add option">${icon('plus')}</button>` : ''}</div></div>
          <div class="pad stack">
            <div class="grid2">${this.inp(`options.${oi}.title`, `Option ${'ABCDE'[oi]} title`, o.title, 'text', "e.g. 4x4 6'H full privacy PT fence @ $55/ft", true)}

            <div class="field"><label for="b-tax">Tax type</label><select class="inp" id="b-tax" data-bind="options.${oi}.taxType"><option value="tax" ${o.taxType !== 'none' ? 'selected' : ''}>${esc(S.cfg.taxLabel)} ${num(S.cfg.taxRate)}%</option><option value="none" ${o.taxType === 'none' ? 'selected' : ''}>No tax</option></select></div></div>
            <div class="tablewrap"><table class="lines"><thead><tr><th style="min-width:240px">Line items</th><th style="width:80px">Qty</th><th style="width:90px">Unit</th><th style="width:110px">Rate</th><th style="width:70px" title="Show as included, no charge">Incl.</th><th style="width:110px;text-align:right">Amount</th><th style="width:40px"></th></tr></thead><tbody>

                <td style="text-align:center;padding-top:14px"><input type="checkbox" class="check" data-bind="options.${oi}.items.${j}.included" ${it.included ? 'checked' : ''} aria-label="Mark as included"></td>
                <td class="amt" id="amt-${oi}-${j}">${it.included ? 'Included' : money(num(it.qty) * num(it.rate))}</td>
                <td><button class="iconbtn" style="width:32px;height:32px;margin-top:2px" data-act="q-delitem" data-i="${j}" aria-label="Remove line">${icon('x')}</button></td></tr>`).join('')}
            </tbody></table></div>
            <div class="row between"><div class="row">${btn('Add line item', 'q-additem', { cls: 'btn-sm', icon: 'plus' })}${q.options.length > 1 ? btn('Remove option', 'q-delopt', { cls: 'btn-sm btn-danger', icon: 'trash' }) : ''}</div></div>

  },
  inp(path, label, val, type = 'text', ph = '', span = false) { const id = 'b-' + path.replace(/\./g, '-'); return `<div class="field" ${span ? 'style="grid-column:1/-1"' : ''}><label for="${id}">${esc(label)}</label><input class="inp" id="${id}" type="${type}" data-bind="${path}" value="${esc(val)}" placeholder="${esc(ph)}"></div>`; },
  totalsHTML(c, o) {
    if (!c) return '';
    return `<span class="t-l">Subtotal</span><span class="num">${money(c.sub)}</span>${c.discount ? `<span class="t-l">Discount</span><span class="num">−${money(c.discount)}</span>` : ''}<span class="t-l">${o.taxType === 'none' ? 'No tax' : esc(S.cfg.taxLabel) + ' ' + num(S.cfg.taxRate) + '%'}</span><span class="num">${money(c.tax)}</span><span class="t-l strong">Option ${'ABCDE'[S.draft.options.indexOf(o)]} total</span><span class="num grand">${money(c.total)}</span>`;
  },
  onBind(path) {
    const q = S.draft; if (!q) return;
    const oi = Math.min(num(UI('q.opt', 0)), q.options.length - 1);
    const m = path.match(/^options\.(\d+)\.items\.(\d+)\.(qty|rate)$/);
    if (m) { const it = q.options[+m[1]].items[+m[2]]; const cell = $(`#amt-${m[1]}-${m[2]}`); if (cell) cell.textContent = it.included ? 'Included' : money(num(it.qty) * num(it.rate)); }
    const c = quoteCalcs(q);
    const tb = $('#q-opttotals'); if (tb) tb.innerHTML = this.totalsHTML(c[oi], q.options[oi]);
    const ht = $('#q-headtotal'); if (ht) ht.textContent = money(c[oi] ? c[oi].total : 0);
    const sv = $('[data-act="q-save"]') ; if (!sv) { const b = $('.phead .acts .btn[disabled]'); if (b) { b.outerHTML = btn('Save changes', 'q-save', { cls: 'btn-primary', icon: 'check' }); } }
    $$('[data-snap-total]').forEach((el) => { const i = +el.dataset.snapTotal; el.textContent = money(c[i] ? c[i].total : 0); });
  },
  aiBox() {
    return `<div class="panel ai-box"><div class="panel-h"><div class="row"><span class="ai-ic">${icon('sparkles')}</span><div><div class="eyebrow accent">AI quote drafter</div><h3 class="h3">Draft from notes</h3></div></div></div><div class="pad stack">
      <textarea class="inp mono" id="ai-notes" rows="5" placeholder="Paste your meeting notes, voice transcript, or quick summary here.&#10;&#10;Example:&#10;Devendar 416-301-0968 pal_deven@yahoo.com, Brampton ON&#10;6ft privacy fence 80ft 3 sides, 2 gates, wants PT wood vs vinyl option"></textarea>
      <div class="row between"><span class="xs muted" id="ai-status">Paste enough for client + scope (≥20 chars). Claude drafts options and line items; you review every field.</span>${btn('Generate draft', 'q-ai', { cls: 'btn-primary btn-sm', icon: 'sparkles' })}</div></div></div>`;
  },
  flow(saved, st) {
    const steps = [];
    if (['new'].includes(st)) steps.push(btn('Mark as sent', 'q-sent', { cls: 'btn-primary btn-sm', icon: 'send' }));
    if (['pending', 'follow_up', 'expired', 'new'].includes(st)) steps.push(btn('Customer approved', 'q-approve', { cls: 'btn-sm', icon: 'check' }), btn('Mark lost', 'q-lost', { cls: 'btn-sm btn-danger' }));
    if (st === 'expired') steps.push(btn('Extend expiry', 'q-extend', { cls: 'btn-sm', icon: 'clock' }));
    if (['approved', 'scheduled', 'in_progress'].includes(st) && !saved.invoiceId) steps.push(btn('Convert to invoice', 'q-invoice', { cls: 'btn-primary btn-sm', icon: 'receipt' }));
    if (saved.invoiceId) steps.push(btn('Open invoice', null, { cls: 'btn-sm', go: 'invoice', param: saved.invoiceId, icon: 'receipt' }));
    if (saved.projectId) steps.push(btn('Open project', null, { cls: 'btn-sm', go: 'project', param: saved.projectId, icon: 'hardhat' }));
    if (st === 'lost') steps.push(btn('Re-open', 'q-reopen', { cls: 'btn-sm' }));
    const msg = { new: 'Quote not sent yet. Mark it sent once the client has it, and a follow-up is scheduled automatically.', pending: `Awaiting the client's decision. Expires ${fmtDate(saved.expiresAt)}.`, follow_up: 'In follow-up. Work it from the Follow-ups queue.', expired: `Expired on ${fmtDate(saved.expiresAt)}. Extend it or mark it lost.`, approved: 'Approved. Convert to an invoice to create the project and bill the deposit.', scheduled: 'Scheduled on the calendar.', in_progress: 'Work is under way.', paid: 'Paid in full. Nice work.', lost: 'Marked lost.' }[st] || '';
    return `<div class="panel pad row between" style="margin-bottom:20px"><div class="row" style="min-width:0;flex:1 1 300px"><span class="eyebrow">Next step</span><span class="small">${esc(msg)}</span></div><div class="row">${steps.join('')}</div></div>`;
  },
  snapshot(q, saved, st, calcs) {
    const exp = saved && saved.expiresAt;
    return `<div class="panel pad"><div class="eyebrow" style="margin-bottom:12px">Snapshot</div><dl class="kv">
      <dt>Status</dt><dd>${badge(QUOTE_STATUS, st)}</dd><dt>Validity</dt><dd>${num(q.validityDays) || 30} days</dd>${exp ? `<dt>Expires</dt><dd>${fmtDate(exp)}</dd>` : ''}
      ${saved ? `<dt>Created</dt><dd>${fmtDate(saved.createdAt)}</dd><dt>Updated</dt><dd>${ago(saved.updatedAt)}</dd>` : ''}
      <dt>Lead</dt><dd>${q.leadId ? `<button class="linkbtn" data-go="lead" data-param="${q.leadId}">Open lead →</button>` : 'New on save'}</dd></dl></div>
      <div class="panel pad"><div class="eyebrow" style="margin-bottom:12px">Option totals</div><dl class="kv">${q.options.map((o, i) => `<dt>${'ABCDE'[i]} · ${esc((o.title || 'Untitled').slice(0, 26))}${o.accepted ? ' ✓' : ''}</dt><dd class="num" data-snap-total="${i}">${money(calcs[i].total)}</dd>`).join('')}</dl></div>
      ${saved ? `<div class="panel pad"><div class="field"><label for="q-fu">Next follow-up</label><input class="inp" type="datetime-local" id="q-fu" value="${esc(saved.followUpAt || '')}" data-onchange="q-fu" data-id="${saved.id}"></div><div class="row" style="margin-top:12px">${btn('Delete quote', 'q-del', { cls: 'btn-sm btn-danger', icon: 'trash' })}</div></div>` : ''}`;
  },
  activityHTML(saved) {
    const a = [...((saved && saved.activity) || [])].reverse();
    return `<div class="panel"><div class="panel-h"><h2 class="h2">Activity</h2></div>${a.length ? `<div class="pad timeline">${a.slice(0, 20).map((x) => `<div class="tl"><div><div class="xs muted">${fmtDT(x.at)}</div><div class="small">${esc(x.text)}</div></div></div>`).join('')}</div>` : '<div class="mini-empty">No activity yet.</div>'}</div>`;
  }
};
const qd = () => S.draft;
const curOpt = () => Math.min(num(UI('q.opt', 0)), qd().options.length - 1);
ACT['q-additem'] = () => { qd().options[curOpt()].items.push(newItem()); S.dirty = true; render(); const rows = $$('.lines tbody tr'); const last = rows[rows.length - 1]; if (last) last.querySelector('textarea').focus(); };
ACT['q-delitem'] = (el) => { const o = qd().options[curOpt()]; o.items.splice(num(el.dataset.i), 1); if (!o.items.length) o.items.push(newItem()); S.dirty = true; render(); };
ACT['q-addopt'] = () => { const q = qd(); if (q.options.length >= 5) return; const base = q.options[curOpt()]; const o = newOption(); o.taxType = base.taxType; q.options.push(o); S.ui['q.opt'] = q.options.length - 1; S.dirty = true; render(); };
ACT['q-delopt'] = () => { const q = qd(); if (q.options.length < 2) return; q.options.splice(curOpt(), 1); S.ui['q.opt'] = 0; S.dirty = true; render(); };
ACT['q-useaddr'] = () => { qd().siteAddress = qd().client.address; S.dirty = true; render(); };
ACT['q-pick-lead'] = (el) => { const q = qd(); const l = byId('leads', el.value); q.leadId = el.value; if (l) { q.client = { name: l.name, phone: l.phone || '', email: l.email || '', address: l.address || '' }; q.repId = q.repId || l.repId || ''; q.service = q.service || l.service || ''; q.category = l.category || q.category; q.source = l.source || q.source; if (!q.siteAddress) q.siteAddress = l.address || ''; } S.dirty = true; render(); };
ACT['q-fu'] = async (el) => { await Store.update('quotes', el.dataset.id, { followUpAt: el.value || null, snoozed: false }); toast('Follow-up updated'); };

function cleanQuote(q) {
  const c = clone(q); delete c.__for; delete c.id;
  c.options = c.options.map((o) => ({ ...o, items: o.items.filter((it) => it.description || num(it.rate) || it.included).map((it) => ({ ...it, qty: num(it.qty), rate: num(it.rate) })) }));
  c.options.forEach((o) => { if (!o.items.length) o.items = [newItem()]; });
  c.discount = { ...c.discount, value: num(c.discount.value) };
  return c;
}

ACT['q-ai'] = async (el) => {

  const sample = await getSampler();
  if (!sample) { toast('The AI drafter isn\'t available in this view.', 'bad'); return; }
  const past = D('quotes').filter((q) => (q.options || []).some((o) => o.items && o.items.length)).slice(-6).map((q) => ({ title: q.title, options: q.options.map((o) => ({ title: o.title, items: o.items.map((i) => `${i.description} | ${i.qty} ${i.unit} @ ${i.rate}`) })) }));
  const prompt = `You draft construction quotes for ${S.cfg.name} (${S.cfg.tagline}). Services: ${S.cfg.services.join(', ')}.
Tax: ${S.cfg.taxLabel} ${S.cfg.taxRate}% is added separately; give pre-tax rates. Currency ${S.cfg.currency}.
${past.length ? 'Recent quotes for pricing reference (title, items as "description | qty unit @ rate"):\n' + JSON.stringify(past).slice(0, 6000) + '\n' : 'No past quotes yet: use typical current market rates for the region implied by the notes, and keep them realistic.\n'}
From the meeting notes below, reply with ONLY a JSON object of this shape:
{"client":{"name":"","phone":"","email":"","address":""},"service":"one of the services or empty","title":"short PDF title","subtitle":"","description":"1-2 sentence scope summary","options":[{"title":"","description":"","items":[{"description":"UPPERCASE SHORT LINE e.g. RIGHT SIDE 20FT — SUPPLY & INSTALL","qty":1,"unit":"ft|ea|sqft|lot","rate":0}]}]}
Give 1-3 options when the notes compare materials or scopes, otherwise 1. Leave unknown contact fields empty.

NOTES:
${notes}`;
  status.textContent = 'Drafting…'; el.disabled = true;
  try {
    const r = await sample.json(prompt, { modelTier: 'default' });
    if (!r || !Array.isArray(r.options)) throw new Error('bad shape');
    const q = qd();
    const cl = r.client || {};

    if (!q.siteAddress) q.siteAddress = q.client.address;

    q.title = r.title || q.title; q.subtitle = r.subtitle || q.subtitle; q.description = r.description || q.description;

  } catch (e) {
    console.error(e);

  } finally { el.disabled = false; }
};

    const pl = (l, v, c) => `<dt>${l}</dt><dd class="num" ${c ? `style="color:${c}"` : ''}>${/^−?\$?0\.00$/.test(v.replace(S.cfg.currency, '$').replace('$', '')) || v === '−' + money(0) ? '—' : v}</dd>`;

        <div class="panel"><div class="panel-h"><div><h2 class="h2">Labour log</h2><div class="sub">${f.hours.toFixed(1)} hours · ${money(sum(labor, (l) => num(l.hours) * num(l.rate)))}</div></div>${btn('Log hours', 'labor-add', { cls: 'btn-sm', icon: 'plus', attrs: `data-id="${p.id}"` })}</div>${labor.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Crew</th><th class="r">Hours</th><th class="r">Rate</th><th class="r">Cost</th><th>Note</th><th></th></tr></thead><tbody>${labor.map((l) => `<tr><td class="small nw">${fmtDate(l.date)}</td><td>${esc(pname(l.memberId) || '—')}</td><td class="r num">${num(l.hours).toFixed(2)}</td><td class="r num">${money(l.rate)}</td><td class="r num">${money(num(l.hours) * num(l.rate))}</td><td class="small muted">${esc(l.note || '')}</td><td><button class="iconbtn" data-act="labor-del" data-lid="${l.id}" aria-label="Remove entry">${icon('trash')}</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="mini-empty">No hours logged yet.</div>'}</div>
        <div class="panel"><div class="panel-h"><div><h2 class="h2">Expenses</h2><div class="sub">Materials, dump, rentals, subs: every cost that isn't crew labour</div></div>${btn('Add expense', 'exp-new', { cls: 'btn-sm', icon: 'plus', attrs: `data-project="${p.id}"` })}</div>${ex.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Vendor</th><th class="r">Amount</th></tr></thead><tbody>${ex.map((e) => `<tr class="click" data-act="exp-edit" data-id="${e.id}"><td class="small nw">${fmtDate(e.date)}</td><td><span class="badge c-grey">${esc(e.category)}</span></td><td>${esc(e.description || '')}</td><td>${esc(e.vendor || (e.subId ? pname(e.subId) : '') || '—')}</td><td class="r num">${money(e.amount)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="mini-empty">No expenses recorded for this project.</div>'}</div>
        <div class="panel"><div class="panel-h"><h2 class="h2">Notes</h2><span class="xs muted">Saved when you click away</span></div><div class="pad"><textarea class="inp" rows="4" data-onchange="pj-notes" aria-label="Project notes" placeholder="Gate codes, utility locates, material orders…">${esc(p.notes || '')}</textarea>${p.description ? `<p class="small muted" style="white-space:pre-wrap;margin:12px 0 0">${esc(p.description)}</p>` : ''}</div></div>

          <div style="border-top:1px solid var(--border);margin:12px 0;padding-top:12px" class="row between"><span class="strong">Gross profit</span><span class="num" style="font-family:var(--font-display);font-weight:900;font-size:22px;color:${f.profit < 0 ? 'var(--danger)' : 'var(--fg)'}">${money(f.profit)}</span></div>
          <div class="row between"><span class="small muted">Margin</span><span class="badge ${f.margin == null ? 'c-grey' : f.margin < 0.2 ? 'c-bad' : f.margin < 0.35 ? 'c-warn' : 'c-ok'}">${f.revenue ? pct(f.margin, 1) : 'No revenue'}</span></div></div>
        <div class="panel pad"><div class="eyebrow" style="margin-bottom:12px">Client</div><dl class="kv"><dt>Name</dt><dd>${esc((p.client && p.client.name) || '—')}</dd><dt>Phone</dt><dd>${p.client && p.client.phone ? `<button class="linkbtn" data-act="copy" data-text="${esc(p.client.phone)}">${esc(p.client.phone)}</button>` : '—'}</dd><dt>Email</dt><dd>${esc((p.client && p.client.email) || '—')}</dd></dl></div>
        <div class="panel pad"><div class="eyebrow" style="margin-bottom:12px">Linked records</div><dl class="kv"><dt>Invoice</dt><dd>${f.inv ? `<button class="linkbtn" data-go="invoice" data-param="${f.inv.id}">${esc(f.inv.number)} · ${statusMeta(INVOICE_STATUS, invStatus(f.inv))[1]}</button>` : '—'}</dd><dt>Quote</dt><dd>${p.quoteId && byId('quotes', p.quoteId) ? `<button class="linkbtn" data-go="quote" data-param="${p.quoteId}">${esc(byId('quotes', p.quoteId).ref)}</button>` : '—'}</dd><dt>Lead</dt><dd>${p.leadId ? `<button class="linkbtn" data-go="lead" data-param="${p.leadId}">Open →</button>` : '—'}</dd></dl><div style="margin-top:14px">${btn('Delete project', 'pj-del', { cls: 'btn-sm btn-danger', icon: 'trash' })}</div></div>
      </div></div>`;

};

/* ============ Schedule calendar ============ */
const STATUS_COLOR = { pending: 'var(--muted-fg)', scheduled: 'var(--info)', in_progress: 'var(--primary)', on_hold: 'var(--warn)', completed: 'var(--ok)', cancelled: 'var(--danger)' };
V.calendar = {
  render() {
    const mode = UI('cal.mode', 'month');
    const anchor = parseKey(UI('cal.anchor', todayKey()));
    const hidden = UI('cal.hide', () => ({ cancelled: true }));
    const who = UI('cal.who', 'all');
    const evs = D('projects').filter((p) => p.start && !hidden[p.status] && (who === 'all' || (p.crew || []).includes(who)));
    let from, to, title;
    if (mode === 'month') { const f = new Date(anchor.getFullYear(), anchor.getMonth(), 1); from = addDays(f, -((f.getDay() + 6) % 7)); to = addDays(from, 41); title = anchor.toLocaleDateString('en-CA', { month: 'long', year: 'numeric' }); }
    else { from = addDays(anchor, -((anchor.getDay() + 6) % 7)); to = addDays(from, 6); title = `${fmtShort(dkey(from))} – ${fmtDate(dkey(to))}`; }
    const days = []; for (let d = new Date(from); d <= to; d = addDays(d, 1)) days.push(dkey(d));
    const on = (k) => evs.filter((p) => p.start <= k && (p.end || p.start) >= k);
    const count = evs.filter((p) => p.start <= dkey(to) && (p.end || p.start) >= dkey(from)).length;
    const head = `<div class="phead"><div><div class="eyebrow">Operations</div><h1 class="title">Schedule Calendar</h1><p class="lede">Scheduled projects across every crew. Set dates on a project to place it here.</p></div><div class="acts"><div class="seg"><button class="${mode === 'month' ? 'on' : ''}" data-act="ui" data-k="cal.mode" data-v="month">Month</button><button class="${mode === 'week' ? 'on' : ''}" data-act="ui" data-k="cal.mode" data-v="week">Week</button></div></div></div>
      <div class="panel filters" style="gap:12px"><div class="row"><span class="lbl">Status</span><div class="legend">${PROJECT_STATUS.map(([s, l]) => `<button class="chip ${hidden[s] ? '' : 'on'}" style="${hidden[s] ? '' : `border-color:${STATUS_COLOR[s]};color:${STATUS_COLOR[s]}`}" data-act="cal-hide" data-s="${s}">${esc(l)}</button>`).join('')}</div></div>
      <div class="row"><span class="lbl">Assignee</span><select class="inp inp-sm" style="width:200px" data-fsel="cal.who" aria-label="Assignee">${[['all', 'All crew'], ...crewList().map((c) => [c.id, c.name])].map(([v, l]) => `<option value="${v}" ${who === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div></div>
      <div class="row between" style="margin:16px 0 12px"><div class="row"><button class="iconbtn" data-act="cal-move" data-d="-1" aria-label="Previous">${icon('chevL')}</button><button class="btn btn-sm" data-act="ui" data-k="cal.anchor" data-v="${todayKey()}">Today</button><button class="iconbtn" data-act="cal-move" data-d="1" aria-label="Next">${icon('chevR')}</button></div><h2 class="h2">${esc(title)}</h2><span class="xs muted">${count} event${count === 1 ? '' : 's'}</span></div>`;
    if (!ready('projects')) return head + `<div class="panel">${loadingRows()}</div>`;
    const t = todayKey();
    if (mode === 'month') {
      return head + `<div class="tablewrap"><div class="cal" style="min-width:720px">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<div class="dow">${d}</div>`).join('')}${days.map((k) => { const list = on(k); const out = parseKey(k).getMonth() !== anchor.getMonth(); return `<div class="day ${out ? 'out' : ''} ${k === t ? 'today' : ''}"><span class="dn">${parseKey(k).getDate()}</span>${list.slice(0, 4).map((p) => `<div class="ev" style="--c:${STATUS_COLOR[p.status] || 'var(--info)'}" data-go="project" data-param="${p.id}" title="${esc(p.title)}">${esc(p.title)}</div>`).join('')}${list.length > 4 ? `<span class="xs muted">+${list.length - 4} more</span>` : ''}</div>`; }).join('')}</div></div>`;
    }
    return head + `<div class="stack">${days.map((k) => { const list = on(k); return `<div class="panel"><div class="panel-h" style="padding:10px 16px"><span class="strong ${k === t ? '' : ''}" style="${k === t ? 'color:var(--today)' : ''}">${fmtDate(k, { weekday: 'long', month: 'short', day: 'numeric' })}</span><span class="xs muted">${list.length} job${list.length === 1 ? '' : 's'}</span></div>${list.length ? `<div class="list">${list.map((p) => `<div class="li click" data-go="project" data-param="${p.id}"><span class="ev" style="--c:${STATUS_COLOR[p.status]};width:6px;padding:0;height:28px"></span><div class="grow"><div class="strong trunc">${esc(p.title)}</div><div class="xs muted trunc">${esc(p.siteAddress || '')} · ${esc((p.crew || []).map(pname).filter(Boolean).join(', ') || 'No crew')}</div></div>${badge(PROJECT_STATUS, p.status)}</div>`).join('')}</div>` : ''}</div>`; }).join('')}</div>`;
  }
};
ACT['cal-hide'] = (el) => { const h = UI('cal.hide', {}); h[el.dataset.s] = !h[el.dataset.s]; render(); };
ACT['cal-move'] = (el) => { const a = parseKey(UI('cal.anchor', todayKey())); const d = num(el.dataset.d); if (UI('cal.mode', 'month') === 'month') a.setMonth(a.getMonth() + d, 1); else a.setDate(a.getDate() + 7 * d); S.ui['cal.anchor'] = dkey(a); render(); };

/* ============ Expenses ============ */
function expenseModal(e = {}, projectId) {
  const projects = D('projects').filter((p) => p.status !== 'cancelled' || p.id === e.projectId);
  openModal({
    title: e.id ? 'Edit expense' : 'New expense',
    body: `<div class="grid2">${F.text('date', 'Date', e.date || todayKey(), { type: 'date' })}${F.select('category', 'Category', EXPENSE_CATS, e.category || 'Materials')}
      ${F.text('amount', 'Amount paid (incl. tax)', e.amount ?? '', { type: 'number', step: '0.01', min: 0 })}<div class="field"><label for="f-hst">${esc(S.cfg.taxLabel)} on receipt</label><div class="row" style="flex-wrap:nowrap"><input class="inp" id="f-hst" name="hst" type="number" step="0.01" min="0" value="${esc(e.hst ?? '')}"><button class="btn btn-sm" type="button" id="hst-calc" title="Work out the tax included in the amount">${num(S.cfg.taxRate)}% incl.</button></div><div class="hint">Recoverable tax is left out of job cost.</div></div>
      ${F.text('vendor', 'Vendor', e.vendor, { ph: 'Home Depot, dump site, rental yard…' })}${F.select('projectId', 'Project', [['', '— Overhead / no project —'], ...projects.map((p) => [p.id, p.title])], e.projectId || projectId || '')}
      <div class="field" id="sub-field" style="${(e.category || 'Materials') === 'Subcontractor' ? '' : 'display:none'}"><label for="f-subId">Subcontractor</label><select class="inp" id="f-subId" name="subId"><option value="">—</option>${subList().map((s) => `<option value="${s.id}" ${e.subId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
      ${F.area('description', 'Description', e.description, { rows: 2, ph: '4x4 PT posts ×22, concrete ×30 bags' })}</div>`,
    foot: `${e.id ? '<button class="btn btn-danger" id="exp-del" style="margin-right:auto">Delete</button>' : ''}<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="exp-ok">${e.id ? 'Save' : 'Add expense'}</button>`,
    onMount: (m) => {
      $('#f-category', m).onchange = (ev) => { $('#sub-field', m).style.display = ev.target.value === 'Subcontractor' ? '' : 'none'; };
      $('#hst-calc', m).onclick = () => { const a = num($('#f-amount', m).value); const r = num(S.cfg.taxRate) / 100; $('#f-hst', m).value = (a - a / (1 + r)).toFixed(2); };
      $('#exp-ok', m).onclick = async () => { const f = formData(m); if (!(num(f.amount) > 0)) { toast('Enter the amount paid.', 'bad'); return; } if (num(f.hst) > num(f.amount)) { toast('Tax can\'t be more than the amount.', 'bad'); return; } const body = { ...f, amount: round2(f.amount), hst: round2(f.hst), subId: f.category === 'Subcontractor' ? f.subId : '' }; if (e.id) await Store.update('expenses', e.id, body); else await Store.add('expenses', body); closeModal(); toast(e.id ? 'Expense saved' : 'Expense added'); };
      const d = $('#exp-del', m); if (d) d.onclick = () => confirmBox('Delete this expense?', 'Job cost and payroll update right away.', 'Delete', async () => { await Store.del('expenses', e.id); toast('Expense deleted'); });
    }
  });
}
ACT['exp-new'] = (el) => expenseModal({}, el.dataset.project);
ACT['exp-edit'] = (el) => expenseModal(byId('expenses', el.dataset.id));
ACT['exp-csv'] = () => saveFile(`expenses-${todayKey()}.csv`, csv([['Date', 'Category', 'Description', 'Project', 'Vendor', 'Amount', 'Tax', 'Net'], ...V.expenses.rows().map((e) => [e.date, e.category, e.description, (byId('projects', e.projectId) || {}).title || '', e.vendor || pname(e.subId), e.amount, e.hst || 0, expNet(e).toFixed(2)])]));
V.expenses = {
  render() {
    return pageHead({ eyebrow: 'Financial workspace', title: 'Expenses', lede: "Materials, gas, dump, equipment, permits, subcontractor, food, rental: every project cost that isn't crew labour.", acts: btn('Export CSV', 'exp-csv', { icon: 'download' }) + btn('New expense', 'exp-new', { cls: 'btn-primary', icon: 'plus' }) })
      + `<div class="panel filters"><div class="frow">${searchBox('exp.q', 'Description, vendor, notes…')}<select class="inp" style="width:220px" data-fsel="exp.pj" aria-label="Project">${[['all', 'All projects'], ['none', 'No project (overhead)'], ...D('projects').map((p) => [p.id, p.title])].map(([v, l]) => `<option value="${v}" ${UI('exp.pj', 'all') === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select><input class="inp" style="width:170px" type="date" data-fsel="exp.from" value="${esc(S.ui['exp.from'] || '')}" aria-label="From"><input class="inp" style="width:170px" type="date" data-fsel="exp.to" value="${esc(S.ui['exp.to'] || '')}" aria-label="To"></div>
      <div><div class="lbl">Categories</div>${chips('exp.cat', [['all', 'All'], ...EXPENSE_CATS.map((c) => [c, c])], UI('exp.cat', 'all'))}</div></div><div id="results">${this.results()}</div>`;
  },
  rows() { const c = UI('exp.cat', 'all'), pj = UI('exp.pj', 'all'), q = S.ui['exp.q'], fr = S.ui['exp.from'], to = S.ui['exp.to']; return D('expenses').filter((e) => (c === 'all' || e.category === c) && (pj === 'all' || (pj === 'none' ? !e.projectId : e.projectId === pj)) && (!fr || e.date >= fr) && (!to || e.date <= to) && match(q, e.description, e.vendor, pname(e.subId))).sort((a, b) => String(b.date).localeCompare(String(a.date))); },
  results() {
    if (!ready('expenses')) return `<div class="panel" style="margin-top:20px">${loadingRows()}</div>`;
    const rows = this.rows(); const pg = pager('exp', rows.length);
    if (!rows.length) return `<div class="count"><b>0</b> expenses · total <b>${money(0)}</b></div><div class="panel">${emptyBox('receipt', 'No expenses match.', 'Adjust filters or record a new one.', btn('New expense', 'exp-new', { cls: 'btn-primary', icon: 'plus' }))}</div>`;
    return `<div class="count"><b>${rows.length}</b> expenses · total <b>${money(sum(rows, (e) => e.amount))}</b> · net of tax <b>${money(sum(rows, expNet))}</b></div><div class="panel tablewrap"><table class="t"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Project</th><th>Vendor</th><th class="r">Tax</th><th class="r">Amount</th></tr></thead><tbody>${pg.slice(rows).map((e) => `<tr class="click" data-act="exp-edit" data-id="${e.id}" tabindex="0"><td class="small nw">${fmtDate(e.date)}</td><td><span class="badge c-grey">${esc(e.category)}</span>${exTag(e)}</td><td>${esc(e.description || '—')}</td><td class="small">${esc((byId('projects', e.projectId) || {}).title || 'Overhead')}</td><td>${esc(e.vendor || pname(e.subId) || '—')}</td><td class="r num small muted">${num(e.hst) ? money(e.hst) : '—'}</td><td class="r num strong">${money(e.amount)}</td></tr>`).join('')}</tbody></table></div>${pg.html}`;
  }
};

/* ============ Overhead ============ */
ACT['oh-new'] = (el) => ohModal(el.dataset.id ? byId('overhead', el.dataset.id) : {});
function ohModal(o) {
  if (!S.isAdmin) { toast('Only the owner and editors can change overhead.', 'bad'); return; }
  openModal({ title: o.id ? 'Edit overhead cost' : 'Add overhead cost', body: `<div class="grid2">${F.text('name', 'Name', o.name, { req: true, ph: 'Shop rent, truck lease, insurance…', span: true })}${F.select('category', 'Category', ['Rent', 'Vehicles', 'Insurance', 'Software', 'Marketing', 'Utilities', 'Salaries', 'Other'], o.category || 'Other')}${F.text('monthly', 'Monthly amount', o.monthly ?? '', { type: 'number', step: '0.01' })}</div>`,
    foot: `${o.id ? '<button class="btn btn-danger" id="oh-del" style="margin-right:auto">Delete</button>' : ''}<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="oh-ok">Save</button>`,
    onMount: (m) => { $('#oh-ok', m).onclick = async () => { const f = formData(m); if (!f.name) { toast('Name is required.', 'bad'); return; } const body = { ...f, monthly: round2(f.monthly) }; if (o.id) await Store.update('overhead', o.id, body); else await Store.add('overhead', body); closeModal(); toast('Saved'); }; const d = $('#oh-del', m); if (d) d.onclick = async () => { await Store.del('overhead', o.id); closeModal(); toast('Deleted'); }; } });
}
V.overhead = {
  render() {
    const rows = D('overhead').slice().sort((a, b) => num(b.monthly) - num(a.monthly));
    const tot = sum(rows, (o) => o.monthly);
    return pageHead({ eyebrow: 'Financial workspace', title: 'Overhead', lede: 'Fixed monthly costs of running the business. Insights subtracts them to show net profit.', acts: S.isAdmin ? btn('Add cost', 'oh-new', { cls: 'btn-primary', icon: 'plus' }) : '' })
      + `<div class="tiles" style="margin-bottom:20px"><div class="tile"><div class="k">Monthly overhead</div><div class="v">${money0(tot)}</div><div class="s">${rows.length} line${rows.length === 1 ? '' : 's'}</div></div><div class="tile" style="--c:var(--info)"><div class="k">Annual</div><div class="v">${money0(tot * 12)}</div><div class="s">At today's rates</div></div><div class="tile" style="--c:var(--violet)"><div class="k">Daily burn</div><div class="v">${money0(tot / 30.44)}</div><div class="s">What each day costs before any job</div></div></div>

/* ============ Payroll: crew & subs ledger ============ */
function payees(r) {
  const labor = D('projects').flatMap((p) => (p.labor || []).map((l) => ({ ...l, projectId: p.id })));
  const outs = D('payouts');
  const crew = crewList().map((c) => {
    const mine = labor.filter((l) => l.memberId === c.id);
    const win = mine.filter((l) => inR(l.date, r));
    const paidAll = sum(outs.filter((o) => o.payeeId === c.id), (o) => o.amount);
    return { p: c, kind: 'crew', hours: sum(win, (l) => l.hours), accrued: sum(win, (l) => num(l.hours) * num(l.rate)), paid: sum(outs.filter((o) => o.payeeId === c.id && inR(o.date, r)), (o) => o.amount), balance: round2(sum(mine, (l) => num(l.hours) * num(l.rate)) - paidAll) };
  });
  const subs = subList().map((s) => {
    const ex = D('expenses').filter((e) => e.category === 'Subcontractor' && e.subId === s.id);
    const paidAll = sum(outs.filter((o) => o.payeeId === s.id), (o) => o.amount);
    return { p: s, kind: 'sub', hours: 0, accrued: sum(ex.filter((e) => inR(e.date, r)), (e) => e.amount), paid: sum(outs.filter((o) => o.payeeId === s.id && inR(o.date, r)), (o) => o.amount), balance: round2(sum(ex, (e) => e.amount) - paidAll) };
  });
  return { crew, subs };
}

/* ============ Insights ============ */
function trendSVG(months) {
  const W = 720, H = 200, P = { l: 56, r: 12, t: 12, b: 28 };
  const mx = Math.max(1, ...months.map((m) => Math.max(m.rev, m.prof)));
  const step = Math.pow(10, Math.floor(Math.log10(mx))); const top = Math.ceil(mx / step) * step;
  const bw = (W - P.l - P.r) / months.length;
  const y = (v) => P.t + (H - P.t - P.b) * (1 - Math.max(0, v) / top);
  const ticks = [0, 0.5, 1].map((f) => top * f);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Monthly revenue and gross profit">
    ${ticks.map((t) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${P.l - 8}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--muted-fg)" font-family="var(--font-mono)">${money0(t).replace(/,000$/, 'k')}</text>`).join('')}
    ${months.map((m, i) => { const x = P.l + i * bw; return `<rect x="${x + bw * 0.14}" y="${y(m.rev)}" width="${bw * 0.34}" height="${H - P.b - y(m.rev)}" fill="var(--primary)"><title>${m.label}: revenue ${money0(m.rev)}</title></rect><rect x="${x + bw * 0.52}" y="${y(m.prof)}" width="${bw * 0.34}" height="${H - P.b - y(m.prof)}" fill="var(--ok)"><title>${m.label}: gross profit ${money0(m.prof)}</title></rect><text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="10" fill="var(--muted-fg)">${m.label}</text>`; }).join('')}
  </svg>`;
}

function resizeImage(file, maxW, maxH) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => { const s = Math.min(1, maxW / img.width, maxH / img.height); const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s)); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); const png = cv.toDataURL('image/png'); res(png.length < 180000 ? png : cv.toDataURL('image/jpeg', 0.88)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

      for (const b of r.content.filter((x) => x.type === 'tool_use')) {
        const t = (opts.tools || []).find((x) => x.name === b.name);
        try { results.push({ type: 'tool_result', tool_use_id: b.id, content: JSON.stringify(t ? await t.execute(b.input || {}) : { error: 'Unknown tool' }).slice(0, 30000) }); }
        catch (e) { results.push({ type: 'tool_result', tool_use_id: b.id, content: String((e && e.message) || e), is_error: true }); }
      }
      messages.push({ role: 'user', content: results });
    }
    return { text: 'That took too many steps. Try a narrower question.' };
  };
  run.json = async (prompt) => {
    const r = await api('/api/ai', { messages: [{ role: 'user', content: prompt }], system: 'Reply with only the JSON value requested. No prose and no code fences.' });
    if (r.stop_reason === 'refusal') { const e = new Error('declined'); e.code = 'refused'; throw e; }
    const t = textOf(r).trim();
    const tryParse = (s) => { try { return JSON.parse(s); } catch { return undefined; } };
    let v = tryParse(t);
    if (v === undefined) { const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) v = tryParse(f[1]); }
    if (v === undefined) { const a = Math.min(...['{', '['].map((c) => (t.indexOf(c) < 0 ? Infinity : t.indexOf(c)))); const b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']')); if (a < b) v = tryParse(t.slice(a, b + 1)); }
    if (v === undefined) { const e = new Error('invalid_json'); e.code = 'invalid_json'; throw e; }
    return v;
  };
  return run;
}

/* ---------- Data store on Supabase (one `docs` table, JSON per record) ---------- */
function dbFail(error) {
  console.error(error);
  const code = error && (error.code === '42501' || /row-level security|permission/i.test(error.message || '')) ? 'invalid_argument' : 'unavailable';
  loadAll().catch(() => {});
  return fail({ code });
}
const CloudStore = {
  async add(col, data, id) {
    id = id || uid();
    const body = Store.strip(Store.stamp(data, true));
    S.data[col] = [...D(col), { id, ...body }]; scheduleRender();
    const { error } = await Store.queue(col + '/' + id, () => SB.from('docs').insert({ collection: col, id, data: body }));
    if (error) return dbFail(error);
    return id;
  },
  async set(col, id, data) {
    const body = Store.strip(Store.stamp(data, false));
    S.data[col] = D(col).some((x) => x.id === id) ? D(col).map((x) => (x.id === id ? { id, ...body } : x)) : [...D(col), { id, ...body }]; scheduleRender();
    const { error } = await Store.queue(col + '/' + id, () => SB.from('docs').upsert({ collection: col, id, data: body }));
    if (error) return dbFail(error);
  },
  async update(col, id, patch) {
    const body = JSON.parse(JSON.stringify({ ...patch, updatedAt: nowISO() }));
    S.data[col] = D(col).map((x) => (x.id === id ? { ...x, ...body } : x)); scheduleRender();
    const { error } = await Store.queue(col + '/' + id, () => SB.rpc('doc_merge', { p_collection: col, p_id: id, p_patch: body }));
    if (error) return dbFail(error);
  },
  async del(col, id) {
    S.data[col] = D(col).filter((x) => x.id !== id); scheduleRender();
    const { error } = await Store.queue(col + '/' + id, () => SB.from('docs').delete().match({ collection: col, id }));
    if (error) return dbFail(error);
  },
  async saveCfg(cfg) {
    const body = JSON.parse(JSON.stringify({ ...cfg, updatedAt: nowISO() }));
    S.cfg = { ...DEFAULT_CFG, ...body }; applyBrand(); render();
    const { error } = await Store.queue('config/company', () => SB.from('docs').upsert({ collection: 'config', id: 'company', data: body }));
    if (error) return dbFail(error);
  }
};
async function loadAll() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await SB.from('docs').select('collection,id,data').order('collection').order('id').range(from, from + 999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  const next = Object.fromEntries(COLS.map((c) => [c, []]));
  rows.forEach((r) => {
    if (r.collection === 'config') { if (r.id === 'company') S.cfg = { ...DEFAULT_CFG, ...r.data }; }
    else if (next[r.collection]) next[r.collection].push({ id: r.id, ...r.data });
  });
  S.data = next; COLS.forEach((c) => (S.loaded[c] = true)); S.stale = false;
  applyBrand(); scheduleRender();
}
function subscribeDocs() {
  SB.channel('docs-all')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, (p) => {
      const row = p.eventType === 'DELETE' ? p.old : p.new;
      if (!row || !row.collection) return;
      const c = row.collection;
      if (c === 'config') { if (p.eventType !== 'DELETE' && row.id === 'company') { S.cfg = { ...DEFAULT_CFG, ...row.data }; applyBrand(); scheduleRender(); } return; }
      if (!S.data[c]) return;
      if (p.eventType === 'DELETE') S.data[c] = S.data[c].filter((x) => x.id !== row.id);
      else { const rec = { id: row.id, ...row.data }; const i = S.data[c].findIndex((x) => x.id === row.id); S.data[c] = i >= 0 ? S.data[c].map((x, k) => (k === i ? rec : x)) : [...S.data[c], rec]; }
      scheduleRender();
    })
    .subscribe((status) => {
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') { if (!S.stale) { S.stale = true; scheduleRender(); } }
      if (status === 'SUBSCRIBED' && S.stale) loadAll().catch(() => {});
    });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.stale) loadAll().catch(() => {}); });
}

  const { data } = await SB.auth.getSession();
  if (/access_token=|error=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  const session = data && data.session;
  SB.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { location.hash = ''; location.reload(); } });
  if (!session) { loginScreen(authErr ? decodeURIComponent(authErr.replace(/\+/g, ' ')) : ''); return; }
  if (flow === 'invite' || flow === 'recovery') { setPasswordScreen(session, flow); return; }
  await enterApp(session);
}
cloudBoot();
</script></body></html>
